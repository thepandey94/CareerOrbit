<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" stroke="#4f46e5" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  <!-- Elliptical Orbit -->
  <ellipse cx="256" cy="256" rx="200" ry="100" stroke="#818cf8" stroke-width="12" transform="rotate(-30 256 256)"/>
  <!-- Central Star / Planet -->
  <circle cx="256" cy="256" r="54" fill="url(#core_grad)"/>
  <!-- Orbiting Node -->
  <circle cx="380" cy="180" r="22" fill="#10b981"/>
  <!-- Satellite Glow -->
  <circle cx="132" cy="332" r="14" fill="#38bdf8"/>
  <defs>
    <linearGradient id="core_grad" x1="202" y1="202" x2="310" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
</svg>
